name: Native Renderer Smoke Build

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-wdr4300-minimal:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Build WDR4300 minimal native renderer image
        run: |
          make build \
            AUDIOWRT_PROFILE=tplink-tl-wdr4300-v1-minimal-usb-audio-25.12.5 \
            AUDIOWRT_PACKAGES_REF=feature/native-dlna-players \
            JOBS=4 \
            VERBOSITY=normal \
            CACHE_DIR=.cache/audiowrt
