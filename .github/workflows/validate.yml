name: Validate AudioWRT

on:
  workflow_dispatch:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  profiles:
    name: Validate profile catalog
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate catalog schema and references
        run: python3 scripts/validate-profile-catalog.py
      - name: Verify generated profile options are current
        run: python3 scripts/sync-profile-workflow.py --check

  validate:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout AudioWRT
        uses: actions/checkout@v4

      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/*.sh tests/*.sh; do
            bash -n "$script"
          done

      - name: Validate Python scripts
        run: python3 -m py_compile scripts/*.py

      - name: Validate Makefile entry point
        run: make help

      - name: Test AudioWRT distribution version contract
        run: bash tests/test-versioning.sh

      - name: Test exact release policy
        run: bash tests/test-release-ref.sh

      - name: Test platform metadata resolver
        run: bash tests/test-build-metadata.sh

      - name: Test firmware image output validation
        run: bash tests/test-image-size-report.sh

      - name: Test runtime ELF link-stub generation
        run: bash tests/test-elf-link-stub.sh

      - name: Test generic package resolver contracts
        run: bash tests/test-package-resolvers.sh
