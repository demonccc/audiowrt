name: Validate AudioWRT

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout AudioWRT
        uses: actions/checkout@v4

      - name: Validate shell scripts
        run: |
          for script in scripts/*.sh tests/*.sh; do
            bash -n "$script"
          done

      - name: Validate Python scripts
        run: python3 -m py_compile scripts/*.py

      - name: Validate Makefile entry point
        run: make help

      - name: Test platform and USB metadata validation
        run: bash tests/test-build-metadata.sh

  mvp-firmware-build:
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout AudioWRT
        uses: actions/checkout@v4

      - name: Install OpenWrt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget

      - name: Build MVP firmware
        run: |
          make build \
            PLATFORM=glinet_gl-mt6000 \
            OPENWRT_REF=openwrt-25.12 \
            AUDIOWRT_PACKAGES_REF=feat/mvp-runtime \
            JOBS=4

      - name: Verify MVP artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -f output/glinet_gl-mt6000/openwrt-25.12/manifest.json
          find output/glinet_gl-mt6000/openwrt-25.12 -maxdepth 1 -type f \
            \( -name '*sysupgrade*' -o -name '*factory*' \) -print -quit | grep -q .

      - name: Upload MVP firmware
        uses: actions/upload-artifact@v4
        with:
          name: audiowrt-mvp-gl-mt6000
          path: output/
          if-no-files-found: error
          retention-days: 7
