name: Validate AudioWRT

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout AudioWRT
        uses: actions/checkout@v4

      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/*.sh tests/*.sh; do
            bash -n "$script"
          done

      - name: Validate Python scripts
        run: python3 -m py_compile scripts/*.py

      - name: Validate Makefile entry point
        run: make help

      - name: Test exact release policy
        run: bash tests/test-release-ref.sh

      - name: Test platform and USB metadata validation
        run: bash tests/test-build-metadata.sh

      - name: Test feature resolution
        run: bash tests/test-features.sh

      - name: Test storage baseline isolation
        run: bash tests/test-storage-baseline.sh

      - name: Test firmware image output validation
        run: bash tests/test-image-size-report.sh

      - name: Test SDK package-only build boundary
        run: bash tests/test-sdk-download-scope.sh

      - name: Test SDK feed configuration
        run: bash tests/test-sdk-feed-config.sh

      - name: Test AudioWRT package build selection
        run: bash tests/test-package-build-selection.sh

      - name: Test AudioWRT source dependency resolution
        run: bash tests/test-source-build-dependencies.sh

      - name: Test distribution file-only package phases
        run: bash tests/test-file-only-packages.sh

      - name: Test provisioning ownership boundaries
        run: bash tests/test-provisioning-ownership.sh

      - name: Test appliance integration
        run: bash tests/test-appliance-integration.sh

      - name: Test canonical builder image pin
        run: bash tests/test-builder-image-pin.sh
