name: Measure AudioWRT wpad

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  wdr4300-size:
    if: github.head_ref == 'test/provisioning-hostapd-size'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout AudioWRT
        uses: actions/checkout@v4

      - name: Restore stable build downloads
        uses: actions/cache@v4
        with:
          path: .cache/audiowrt
          key: audiowrt-${{ runner.os }}-tplink-tl-wdr4300-v1-minimal-usb-bluetooth-25.12.5-wpad-size
          restore-keys: |
            audiowrt-${{ runner.os }}-tplink-tl-wdr4300-v1-minimal-usb-bluetooth-25.12.5-

      - name: Build WDR4300 with multicall wpad
        run: |
          make build \
            AUDIOWRT_PROFILE='tplink-tl-wdr4300-v1-minimal-usb-bluetooth-25.12.5' \
            AUDIOWRT_PACKAGES_REF='fix/provisioning-runtime' \
            JOBS='4' \
            VERBOSITY='normal' \
            CACHE_DIR='.cache/audiowrt'

      - name: Show size report
        if: success()
        run: |
          cat output/tplink-tl-wdr4300-v1-minimal-usb-bluetooth-25.12.5/image-size-report.txt
          echo
          echo '=== Local APK sizes ==='
          du -h output/tplink-tl-wdr4300-v1-minimal-usb-bluetooth-25.12.5/local-apks/*.apk | sort -h

      - name: Upload size artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wdr4300-audiowrt-wpad-size
          path: output/
          if-no-files-found: warn
          retention-days: 7
