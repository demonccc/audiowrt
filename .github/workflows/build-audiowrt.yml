name: Build AudioWRT
run-name: AudioWRT ${{ inputs.audiowrt_profile }}

on:
  workflow_dispatch:
    inputs:
      audiowrt_profile:
        description: "AudioWRT device + flavor + OpenWrt version (YAML file name without extension)"
        required: true
        default: tplink-tl-wdr4300-v1-minimal-25.12.5
        type: choice
        options:
          # BEGIN GENERATED PROFILE OPTIONS
          - linksys-ea8300-full-25.12.5
          - linksys-ea8300-minimal-25.12.5
          - linksys-ea8300-standard-25.12.5
          - raspberry-pi-3-full-25.12.5
          - raspberry-pi-3-minimal-25.12.5
          - raspberry-pi-3-standard-25.12.5
          - raspberry-pi-4-full-25.12.5
          - raspberry-pi-4-minimal-25.12.5
          - raspberry-pi-4-standard-25.12.5
          - tplink-archer-a9-v6-full-25.12.5
          - tplink-archer-a9-v6-minimal-25.12.5
          - tplink-archer-a9-v6-standard-25.12.5
          - tplink-tl-wdr4300-v1-minimal-25.12.5
          - x86-64-full-25.12.5
          - x86-64-minimal-25.12.5
          - x86-64-standard-25.12.5
          # END GENERATED PROFILE OPTIONS
      audiowrt_packages_ref:
        description: "AudioWRT reusable package-feed branch, tag or commit"
        required: true
        default: main
        type: string
      jobs:
        description: "Number of parallel package build jobs"
        required: true
        default: '4'
        type: string
      verbosity:
        description: "OpenWrt/SDK build log detail"
        required: true
        default: normal
        type: choice
        options:
          - normal
          - verbose
          - debug

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.audiowrt_profile }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout AudioWRT
        uses: actions/checkout@v4

      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true

      - name: Build AudioWRT
        run: |
          make build \
            AUDIOWRT_PROFILE='${{ inputs.audiowrt_profile }}' \
            AUDIOWRT_PACKAGES_REF='${{ inputs.audiowrt_packages_ref }}' \
            JOBS='${{ inputs.jobs }}' \
            VERBOSITY='${{ inputs.verbosity }}'

      - name: Collect failure diagnostics
        if: failure()
        shell: bash
        run: |
          diagnostics=output/failure-diagnostics
          mkdir -p "$diagnostics"

          if [[ -d .work ]]; then
            while IFS= read -r -d '' file; do
              relative="${file#.work/}"
              destination="$diagnostics/$relative"
              mkdir -p "$(dirname "$destination")"
              cp -f "$file" "$destination" || true
            done < <(find .work -type f \( -name 'config.log' -o -name '*.log' \) -print0 2>/dev/null)
          fi

      - name: Upload firmware and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audiowrt-${{ inputs.audiowrt_profile }}
          path: output/
          if-no-files-found: warn
          retention-days: 14
