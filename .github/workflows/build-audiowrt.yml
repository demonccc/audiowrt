name: Build AudioWRT
run-name: AudioWRT ${{ inputs.audiowrt_profile }}

on:
  workflow_dispatch:
    inputs:
      audiowrt_profile:
        description: "AudioWRT device + flavor + OpenWrt version (YAML file name without extension)"
        required: true
        default: tplink-tl-wdr4300-v1-minimal-usb-bluetooth-25.12.5
        type: choice
        options:
          # BEGIN GENERATED PROFILE OPTIONS
          - linksys-ea8300-usb-bluetooth-audio-25.12.5
          - raspberry-pi-3-usb-bluetooth-audio-25.12.5
          - raspberry-pi-4-usb-bluetooth-audio-25.12.5
          - tplink-tl-wdr4300-v1-minimal-usb-bluetooth-25.12.5
          - tplink-tl-wdr4300-v1-usb-audio-25.12.5
          - x86-64-usb-bluetooth-audio-25.12.5
          # END GENERATED PROFILE OPTIONS
      audiowrt_packages_ref:
        description: "AudioWRT reusable package-feed branch, tag or commit"
        required: true
        default: main
        type: string
      jobs:
        description: "Number of parallel package build jobs"
        required: true
        default: '4'
        type: string
      verbosity:
        description: "OpenWrt/SDK build log detail"
        required: true
        default: normal
        type: choice
        options:
          - normal
          - verbose
          - debug

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.audiowrt_profile }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout AudioWRT
        uses: actions/checkout@v4

      - name: Restore stable build downloads
        if: ${{ !endsWith(inputs.audiowrt_profile, '-snapshot') }}
        uses: actions/cache@v4
        with:
          path: .cache/audiowrt
          key: audiowrt-${{ runner.os }}-${{ inputs.audiowrt_profile }}-${{ hashFiles('scripts/build.sh', 'scripts/run-in-docker.sh', 'scripts/resolve-openwrt-artifacts.py', 'config/**', 'profiles/**') }}
          restore-keys: |
            audiowrt-${{ runner.os }}-${{ inputs.audiowrt_profile }}-

      - name: Build AudioWRT
        run: |
          make build \
            AUDIOWRT_PROFILE='${{ inputs.audiowrt_profile }}' \
            AUDIOWRT_PACKAGES_REF='${{ inputs.audiowrt_packages_ref }}' \
            JOBS='${{ inputs.jobs }}' \
            VERBOSITY='${{ inputs.verbosity }}' \
            CACHE_DIR='.cache/audiowrt'

      - name: Collect failure diagnostics
        if: failure()
        shell: bash
        run: |
          diagnostics=output/failure-diagnostics
          mkdir -p "$diagnostics"

          if [[ -d .work ]]; then
            while IFS= read -r -d '' file; do
              relative="${file#.work/}"
              destination="$diagnostics/$relative"
              mkdir -p "$(dirname "$destination")"
              cp -f "$file" "$destination" || true
            done < <(find .work -type f \( -name 'config.log' -o -name '*.log' \) -print0 2>/dev/null)
          fi

      - name: Upload firmware and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audiowrt-${{ inputs.audiowrt_profile }}
          path: output/
          if-no-files-found: warn
          retention-days: 14
