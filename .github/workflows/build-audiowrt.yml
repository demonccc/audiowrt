name: Build AudioWRT
run-name: AudioWRT ${{ inputs.openwrt_release }} / ${{ inputs.platform }}

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "OpenWrt device profile identifier"
        required: true
        default: tplink_tl-wdr4300-v1
        type: string
      openwrt_release:
        description: "Exact final OpenWrt release tag/version (X.Y.Z or vX.Y.Z)"
        required: true
        default: 25.12.5
        type: string
      audiowrt_packages_ref:
        description: "AudioWRT reusable package-feed branch, tag or commit"
        required: true
        default: main
        type: string
      features:
        description: "Optional preinstalled services (mpd, airplay, spotify, storage); leave empty for core only"
        required: false
        default: ''
        type: string
      jobs:
        description: "Number of parallel package build jobs"
        required: true
        default: '4'
        type: string
      verbosity:
        description: "OpenWrt/SDK build log detail"
        required: true
        default: normal
        type: choice
        options:
          - normal
          - verbose
          - debug

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.platform }}-${{ inputs.openwrt_release }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout AudioWRT
        uses: actions/checkout@v4

      - name: Validate exact OpenWrt release
        env:
          OPENWRT_RELEASE: ${{ inputs.openwrt_release }}
        run: |
          if ! [[ "$OPENWRT_RELEASE" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "OpenWrt release must be an exact final version such as 25.12.5 or v25.12.5." >&2
            echo "Branches, aliases, snapshots and release candidates are not accepted." >&2
            exit 1
          fi

      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true

      - name: Build AudioWRT
        run: |
          make build \
            PLATFORM='${{ inputs.platform }}' \
            OPENWRT_RELEASE='${{ inputs.openwrt_release }}' \
            AUDIOWRT_PACKAGES_REF='${{ inputs.audiowrt_packages_ref }}' \
            FEATURES='${{ inputs.features }}' \
            JOBS='${{ inputs.jobs }}' \
            VERBOSITY='${{ inputs.verbosity }}'

      - name: Collect failure diagnostics
        if: failure()
        shell: bash
        run: |
          diagnostics=output/failure-diagnostics
          mkdir -p "$diagnostics"

          if [[ -d .work ]]; then
            while IFS= read -r -d '' file; do
              relative="${file#.work/}"
              destination="$diagnostics/$relative"
              mkdir -p "$(dirname "$destination")"
              cp -f "$file" "$destination" || true
            done < <(find .work -type f \( -name 'config.log' -o -name '*.log' \) -print0 2>/dev/null)
          fi

      - name: Upload firmware and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audiowrt-${{ inputs.platform }}-${{ inputs.openwrt_release }}
          path: output/
          if-no-files-found: warn
          retention-days: 14
