name: Refactor package taxonomy once

on:
  push:
    branches:
      - refactor/package-taxonomy

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/package-taxonomy
      - name: Update hardcoded package identifiers
        shell: python
        run: |
          from pathlib import Path
          path = Path('scripts/build.sh')
          text = path.read_text()
          replacements = {
              'audiowrt-wpad': 'hostapd-wpa-supplicant-tailored',
              'audiowrt-kmod-bluetooth': 'kmod-bluetooth-trimmed',
              'kmod-audiowrt-bluetooth': 'kmod-bluetooth-trimmed',
              'audiowrt-bluez': 'bluez-trimmed',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text)
      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/build.sh
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'refactor(build): update package taxonomy identifiers'
          git push origin HEAD:refactor/package-taxonomy
