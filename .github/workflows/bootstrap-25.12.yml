name: Bootstrap AudioWRT 25.12 branch

on:
  create:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bootstrap-25.12.yml'
      - 'bootstrap/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event_name != 'create' || github.ref_name == 'audiowrt-25.12'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project metadata
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Bootstrap downstream source branch
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin audiowrt-25.12:audiowrt-25.12 2>/dev/null || true
          if git show audiowrt-25.12:rules.mk >/dev/null 2>&1; then
            echo 'audiowrt-25.12 already contains an OpenWrt source tree; nothing to bootstrap.'
            exit 0
          fi

          tmp="$(mktemp -d)"
          cp -a bootstrap/. "$tmp/"

          git remote add upstream https://github.com/openwrt/openwrt.git
          git fetch --depth=1 upstream openwrt-25.12
          git checkout -B audiowrt-25.12 FETCH_HEAD

          if ! grep -q '^src-git audiowrt ' feeds.conf.default; then
            printf '\nsrc-git audiowrt https://github.com/demonccc/audiowrt-packages.git\n' >> feeds.conf.default
          fi

          cp -a "$tmp/root/." .

          git add feeds.conf.default package/audiowrt-profile
          git -c user.name='AudioWRT Automation' \
              -c user.email='actions@users.noreply.github.com' \
              commit -m 'AudioWRT: bootstrap 25.12 distribution'
          git push --force-with-lease origin audiowrt-25.12
