name: Build AudioWRT Packages
run-name: AudioWRT packages ${{ inputs.audiowrt_profile }} / ${{ inputs.package }}

on:
  workflow_dispatch:
    inputs:
      audiowrt_profile:
        description: "Target device + flavor + OpenWrt version used to select the exact SDK/architecture"
        required: true
        default: tplink-tl-wdr4300-v1-minimal-usb-bluetooth-25.12.5
        type: choice
        options:
          # BEGIN GENERATED PROFILE OPTIONS
          - linksys-ea8300-usb-bluetooth-audio-25.12.5
          - raspberry-pi-3-usb-bluetooth-audio-25.12.5
          - raspberry-pi-4-usb-bluetooth-audio-25.12.5
          - tplink-tl-wdr4300-v1-minimal-usb-audio-25.12.5
          - tplink-tl-wdr4300-v1-minimal-usb-bluetooth-25.12.5
          - x86-64-usb-bluetooth-audio-25.12.5
          # END GENERATED PROFILE OPTIONS
      package:
        description: "AudioWRT package name, or 'all' for all AudioWRT packages selected by the profile"
        required: true
        default: all
        type: string
      audiowrt_packages_ref:
        description: "AudioWRT reusable package-feed branch, tag or commit"
        required: true
        default: main
        type: string
      jobs:
        description: "Number of parallel package build jobs"
        required: true
        default: '4'
        type: string
      verbosity:
        description: "OpenWrt SDK build log detail"
        required: true
        default: normal
        type: choice
        options:
          - normal
          - verbose
          - debug

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.audiowrt_profile }}-${{ inputs.package }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout AudioWRT
        uses: actions/checkout@v4

      - name: Restore stable SDK downloads
        if: ${{ !endsWith(inputs.audiowrt_profile, '-snapshot') }}
        uses: actions/cache@v4
        with:
          path: .cache/audiowrt
          key: audiowrt-packages-${{ runner.os }}-${{ inputs.audiowrt_profile }}-${{ hashFiles('scripts/build.sh', 'scripts/run-in-docker.sh', 'scripts/resolve-openwrt-artifacts.py', 'config/**', 'profiles/**') }}
          restore-keys: |
            audiowrt-packages-${{ runner.os }}-${{ inputs.audiowrt_profile }}-
            audiowrt-${{ runner.os }}-${{ inputs.audiowrt_profile }}-

      - name: Build AudioWRT package APKs
        run: |
          make packages \
            AUDIOWRT_PROFILE='${{ inputs.audiowrt_profile }}' \
            PACKAGE='${{ inputs.package }}' \
            AUDIOWRT_PACKAGES_REF='${{ inputs.audiowrt_packages_ref }}' \
            JOBS='${{ inputs.jobs }}' \
            VERBOSITY='${{ inputs.verbosity }}' \
            CACHE_DIR='.cache/audiowrt'

      - name: Show produced APKs
        if: success()
        run: |
          find "output/packages/${{ inputs.audiowrt_profile }}/packages" \
            -maxdepth 1 -type f -name '*.apk' -printf '%f\n' | sort

      - name: Collect failure diagnostics
        if: failure()
        shell: bash
        run: |
          diagnostics=output/failure-diagnostics
          mkdir -p "$diagnostics"
          if [[ -d .work/packages ]]; then
            while IFS= read -r -d '' file; do
              relative="${file#.work/}"
              destination="$diagnostics/$relative"
              mkdir -p "$(dirname "$destination")"
              cp -f "$file" "$destination" || true
            done < <(find .work/packages -type f \( -name 'config.log' -o -name '*.log' \) -print0 2>/dev/null)
          fi

      - name: Upload APKs and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audiowrt-packages-${{ inputs.audiowrt_profile }}-${{ inputs.package }}
          path: output/
          if-no-files-found: warn
          retention-days: 14
