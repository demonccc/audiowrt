name: Build AudioWRT

on:
  workflow_dispatch:
    inputs:
      platform:
        description: OpenWrt device profile identifier, for example glinet_gl-mt6000
        required: true
        type: string
      openwrt_ref:
        description: OpenWrt branch, tag or commit. Use stable for the latest final release.
        required: true
        default: stable
        type: string
      audiowrt_packages_ref:
        description: AudioWRT package-feed branch or tag
        required: true
        default: main
        type: string
      jobs:
        description: Number of parallel build jobs
        required: true
        default: '4'
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout AudioWRT
        uses: actions/checkout@v4

      - name: Install OpenWrt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget

      - name: Build AudioWRT
        run: |
          make build \
            PLATFORM='${{ inputs.platform }}' \
            OPENWRT_REF='${{ inputs.openwrt_ref }}' \
            AUDIOWRT_PACKAGES_REF='${{ inputs.audiowrt_packages_ref }}' \
            JOBS='${{ inputs.jobs }}'

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: audiowrt-${{ inputs.platform }}-${{ inputs.openwrt_ref }}
          path: output/
          if-no-files-found: error
          retention-days: 14
