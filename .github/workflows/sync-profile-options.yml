name: Sync build profile options

on:
  push:
    branches: [main]
    paths:
      - 'profiles/**'
      - 'config/flavors/**'
      - 'scripts/resolve-audiowrt-profile.py'
      - 'scripts/validate-profile-catalog.py'
      - 'scripts/sync-profile-workflow.py'
      - '.github/workflows/sync-profile-options.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-build-profile-options
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Validate and regenerate dropdown
        run: |
          python3 scripts/validate-profile-catalog.py
          python3 scripts/sync-profile-workflow.py
          python3 scripts/sync-profile-workflow.py --check
      - name: Publish generated options
        env:
          PROFILE_SYNC_TOKEN: ${{ secrets.PROFILE_SYNC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/workflows/build-audiowrt.yml; then
            echo 'Profile options are already current.'
            exit 0
          fi
          if [ -z "$PROFILE_SYNC_TOKEN" ]; then
            echo '::error::Configure PROFILE_SYNC_TOKEN with Contents and Workflows write permissions and permission to publish the generated workflow on main.'
            exit 1
          fi
          git config user.name 'AudioWRT profile sync'
          git config user.email 'noreply@users.noreply.github.com'
          git add .github/workflows/build-audiowrt.yml
          git commit -m 'ci: synchronize build profile options'
          askpass="$RUNNER_TEMP/audiowrt-profile-askpass.sh"
          cat > "$askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$PROFILE_SYNC_TOKEN" ;;
          esac
          SH
          chmod 700 "$askpass"
          trap 'rm -f "$askpass"' EXIT
          # A concurrent main update rejects this push; never overwrite it.
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git push origin HEAD:main
